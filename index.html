.dots{display:flex;gap:6px;width:100%;justify-content:center}.dots i{width:100%;max-width:44px;height:6px;border-radius:3px;background:var(--line)}.dots i.d{background:var(--accent);opacity:.55}.dots i.c{background:var(--accent)}.stagelabel{font-size:.85rem;color:var(--muted);min-height:1.3em}.mascot{width:min(52vw,190px);height:auto;animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}.blink{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}.bubble{display:flex;flex-direction:column;gap:14px;margin-top:4px}h1,h2{font-family:var(--f-disp);margin:0;line-height:1.25;text-wrap:balance;font-weight:700;font-size:1.45rem}h1:focus,h2:focus{outline:none}p{margin:0}.hint{font-size:.92rem;color:var(--muted)}.choices{display:flex;flex-direction:column;gap:10px}.choices button{font-weight:600;font-size:1.02rem;min-height:56px}.choices button:hover{border-color:var(--accent);background:var(--accent-soft)}.choices button.sel{outline:3px solid var(--accent);outline-offset:2px}button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;font-size:1.05rem;min-height:56px}button.primary:hover{filter:brightness(1.1)}button.link{border:0;background:none;color:var(--accent);text-decoration:underline;min-height:44px;padding:8px 4px;font-weight:500}.nav{display:flex;justify-content:center}.result{display:flex;flex-direction:column;gap:10px}.lv{font-family:var(--f-disp);font-size:1.9rem;font-weight:700;line-height:1.15}[data-lv="low"] .lv{color:var(--low)}[data-lv="mid"] .lv{color:var(--mid)}[data-lv="high"] .lv{color:var(--high)}.score{font-size:.92rem;font-variant-numeric:tabular-nums}.track{position:relative;height:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}.fill{height:100%;background:var(--fg);opacity:.75}.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--muted)}.scale{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:4px}a.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;border:2px solid var(--accent);color:var(--accent);font-weight:600;text-decoration:none;padding:12px 16px;text-align:center}a.btn:hover{background:var(--accent-soft)}.danger{font-size:.95rem}.danger b{color:var(--high)}.note{border-top:1px solid var(--line);padding-top:14px;font-size:.92rem;color:var(--muted)}.note b{color:var(--fg)}.card{border-top:1px solid var(--line);padding-top:14px}ul.sum{list-style:none;margin:8px 0 0;padding:0}ul.sum li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:.95rem}ul.sum li:first-child{border-top:0}ul.sum span:last-child{color:var(--muted);flex:none}ul.sum li.on span:last-child{color:var(--fg);font-weight:600}details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:500}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:500}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
