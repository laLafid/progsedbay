<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tes Gejala TBC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: guessing-game screen. Stage with a mascot on top, speech bubble with the question, big stacked answer buttons below. */
:root{
  --bg:#eef4f4; --surface:#ffffff; --fg:#14292b; --muted:#4d6466; --line:#c9d6d6;
  --accent:#0f6b6e; --accent-fg:#ffffff; --accent-soft:#dcefef;
  --low:#1f6b41; --mid:#8f4a07; --high:#a3201a;
  --low-soft:#e0f1e6; --mid-soft:#fbeedd; --high-soft:#fbe4e2;
  --stage1:#0c3a3e; --stage2:#1a6a6d;
  --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-disp:"Baloo 2","IBM Plex Sans",system-ui,sans-serif;
  --scale:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1617; --surface:#162526; --fg:#e8f2f2; --muted:#a3b8b9; --line:#2f4749;
  --accent:#5cc2c4; --accent-fg:#0b1f20; --accent-soft:#1b3b3c;
  --low:#7fd8a3; --mid:#f3b270; --high:#f6998f;
  --low-soft:#183626; --mid-soft:#3a2a17; --high-soft:#3d1f1d;
  --stage1:#07282b; --stage2:#12494c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1617; --surface:#162526; --fg:#e8f2f2; --muted:#a3b8b9; --line:#2f4749;
  --accent:#5cc2c4; --accent-fg:#0b1f20; --accent-soft:#1b3b3c;
  --low:#7fd8a3; --mid:#f3b270; --high:#f6998f;
  --low-soft:#183626; --mid-soft:#3a2a17; --high-soft:#3d1f1d;
  --stage1:#07282b; --stage2:#12494c; color-scheme:dark}
html{font-size:calc(16px*var(--scale))}
body{background:var(--bg);color:var(--fg);font:1rem/1.6 var(--f-body);
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:1.1rem}
.size{display:flex;gap:6px}
button{font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer;min-height:48px;text-align:center}
.size button{min-width:44px;min-height:40px;padding:2px 10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--fg)}
.dots{display:flex;gap:6px;width:100%;justify-content:center}
.dots i{width:100%;max-width:44px;height:6px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--accent);opacity:.55}
.dots i.c{background:var(--accent)}
.stagelabel{font-size:.85rem;color:var(--muted);min-height:1.3em}
.mascot{width:min(52vw,190px);height:auto;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.blink{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bubble{display:flex;flex-direction:column;gap:14px;margin-top:4px}
h1,h2{font-family:var(--f-disp);margin:0;line-height:1.25;text-wrap:balance;font-weight:700;font-size:1.45rem}
h1:focus,h2:focus{outline:none}
p{margin:0}
.hint{font-size:.92rem;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:10px}
.choices button{font-weight:600;font-size:1.02rem;min-height:56px}
.choices button:hover{border-color:var(--accent);background:var(--accent-soft)}
.choices button.sel{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;font-size:1.05rem;min-height:56px}
button.primary:hover{filter:brightness(1.1)}
button.link{border:0;background:none;color:var(--accent);text-decoration:underline;min-height:44px;padding:8px 4px;font-weight:500}
.nav{display:flex;justify-content:center}
.result{display:flex;flex-direction:column;gap:10px}
.lv{font-family:var(--f-disp);font-size:1.9rem;font-weight:700;line-height:1.15}
[data-lv="low"] .lv{color:var(--low)}[data-lv="mid"] .lv{color:var(--mid)}[data-lv="high"] .lv{color:var(--high)}
.score{font-size:.92rem;font-variant-numeric:tabular-nums}
.track{position:relative;height:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--fg);opacity:.75}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--muted)}
.scale{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:4px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;border:2px solid var(--accent);color:var(--accent);font-weight:600;text-decoration:none;padding:12px 16px;text-align:center}
a.btn:hover{background:var(--accent-soft)}
.danger{font-size:.95rem}
.danger b{color:var(--high)}
.note{border-top:1px solid var(--line);padding-top:14px;font-size:.92rem;color:var(--muted)}
.note b{color:var(--fg)}
.card{border-top:1px solid var(--line);padding-top:14px}
ul.sum{list-style:none;margin:8px 0 0;padding:0}
ul.sum li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:.95rem}
ul.sum li:first-child{border-top:0}
ul.sum span:last-child{color:var(--muted);flex:none}
ul.sum li.on span:last-child{color:var(--fg);font-weight:600}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>

</head>
<body>
<main>
  <div class="top">
    <span class="brand">Tes Gejala TBC</span>
    <div class="size" role="group" aria-label="Ukuran tulisan">
      <button type="button" id="sm" aria-label="Perkecil tulisan">A−</button>
      <button type="button" id="lg" aria-label="Perbesar tulisan">A+</button>
    </div>
  </div>

  <section class="stage" aria-label="Maskot">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <svg class="mascot" id="mascot" viewBox="0 0 180 170" role="img" aria-label="Maskot paru-paru yang ramah">
      <rect x="81" y="6" width="18" height="46" rx="9" fill="#7fd3cf"/>
      <path d="M90 42 L68 62 M90 42 L112 62" stroke="#7fd3cf" stroke-width="10" stroke-linecap="round"/>
      <path d="M86 58 C60 40 18 60 14 108 C11 146 40 164 70 158 C86 155 88 140 88 126 Z" fill="#aef0ea" stroke="#5fb9b4" stroke-width="3"/>
      <path d="M94 58 C120 40 162 60 166 108 C169 146 140 164 110 158 C94 155 92 140 92 126 Z" fill="#aef0ea" stroke="#5fb9b4" stroke-width="3"/>
      <circle cx="42" cy="118" r="8" fill="#ff9fa8" opacity=".55"/><circle cx="138" cy="118" r="8" fill="#ff9fa8" opacity=".55"/>
      <g class="blink"><ellipse cx="62" cy="96" rx="7" ry="9" fill="#0c3a3e"/><ellipse cx="118" cy="96" rx="7" ry="9" fill="#0c3a3e"/>
        <circle cx="64.5" cy="92.5" r="2.4" fill="#fff"/><circle cx="120.5" cy="92.5" r="2.4" fill="#fff"/></g>
      <g id="brows" stroke="#0c3a3e" stroke-width="4" stroke-linecap="round" fill="none"></g>
      <path id="mouth" d="M76 122 Q90 134 104 122" stroke="#0c3a3e" stroke-width="4" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="stagelabel" id="sl" aria-live="polite"></div>
  </section>

  <div id="view"></div>
</main>

<script>
const Q=[
 {k:"A1",t:"Batuk",q:"Kamu lagi batuk, terutama batuk berdahak yang tidak sembuh-sembuh?"},
 {k:"A2",t:"Demam",q:"Kamu demam atau badan terasa meriang, biasanya ringan dan hilang timbul?"},
 {k:"A3",t:"Berat badan turun",q:"Berat badanmu turun tanpa sengaja, bukan karena diet atau olahraga?"},
 {k:"A4",t:"Keringat malam",q:"Kamu berkeringat banyak di malam hari, padahal udaranya tidak panas?"},
 {k:"A5",t:"Nafsu makan menurun",q:"Nafsu makanmu menurun dibanding biasanya?"},
 {k:"A6",t:"Nyeri dada",q:"Dadamu terasa nyeri, terutama saat tarik napas atau batuk?"},
 {k:"A7",t:"Sesak napas",q:"Kamu merasa sesak atau sulit bernapas?"}
];
/* Tabel frekuensi dari Excel: baris "Benar" = Seminggu kurang, baris "Tidak" = Seminggu lebih */
const C=[{n:"Seminggu kurang",c:[1,1,1,1,1,1,1]},{n:"Seminggu lebih",c:[3,2,2,2,2,2,3]}];
const TOTAL=C.reduce((a,k)=>a+k.c.reduce((x,y)=>x+y,0),0);   // 23
C.forEach(k=>{k.sum=k.c.reduce((x,y)=>x+y,0);k.prior=k.sum/TOTAL;k.lik=k.c.map(v=>v/k.sum)});
const OPT=["Tidak","Ya"];
const REACT=["Oke, lanjut ya.","Hmm, aku catat ya."];
let step=-1, ans=Q.map(()=>null), last="";
const view=document.getElementById("view");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const f=(x,d=4)=>x.toFixed(d), pc=x=>(x*100).toFixed(1).replace(".",",")+"%";

const lvl=B=>B.sel.length===0?"low":B.p[1]>=.70?"high":B.p[1]>=.60?"mid":"low";
function bayes(){
  const sel=ans.map((v,i)=>v===1?i:-1).filter(i=>i>=0);
  const sc=C.map(k=>sel.reduce((p,i)=>p*k.lik[i],k.prior));   // prior x likelihood gejala terpilih
  const s=sc.reduce((a,b)=>a+b,0);
  return {sel,sc,p:sc.map(x=>x/s)};
}
function mood(m){
  const mouth=document.getElementById("mouth"), brows=document.getElementById("brows");
  if(m==="high"){mouth.setAttribute("d","M76 128 Q90 114 104 128");brows.innerHTML='<path d="M52 80 L72 85"/><path d="M128 80 L108 85"/>'}
  else if(m==="mid"){mouth.setAttribute("d","M77 124 L103 124");brows.innerHTML='<path d="M52 83 L72 83"/><path d="M128 80 L108 84"/>'}
  else{mouth.setAttribute("d","M76 122 Q90 134 104 122");brows.innerHTML=''}
}
function dots(){
  document.getElementById("dots").innerHTML=Q.map((_,i)=>`<i class="${step>=Q.length||i<step?"d":i===step?"c":""}"></i>`).join("");
}
function focusHead(){const h=view.querySelector("[data-head]");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}}

function render(){
  const B=bayes(), win=B.p[1]>=B.p[0]?1:0;
  dots();
  if(step<0){
    mood("low");document.getElementById("sl").textContent="";
    view.innerHTML=`<section class="bubble"><h1 data-head>Coba pikirkan gejala yang kamu rasakan. Biar aku tebak risikonya.</h1>
      <p class="hint">Cuma ada ${Q.length} pertanyaan singkat. Tidak perlu daftar, dan tidak ada data yang disimpan. Hasilnya hanya gambaran awal, bukan diagnosis dokter.</p>
      <button class="primary" id="start" type="button">Mulai</button></section>`;
  } else if(step<Q.length){
    const x=Q[step];
    mood(lvl(B));
    document.getElementById("sl").textContent=`Pertanyaan ${step+1} dari ${Q.length}`;
    view.innerHTML=`<section class="bubble" aria-labelledby="qh">
      ${last?`<p class="hint">${last}</p>`:""}
      <h2 id="qh" data-head>${esc(x.q)}</h2>
      <div class="choices" role="group" aria-labelledby="qh">${OPT.map((o,v)=>`<button type="button" data-v="${v}" class="${ans[step]===v?"sel":""}" aria-pressed="${ans[step]===v}">${o}</button>`).join("")}</div>
      <div class="nav"><button class="link" id="back" type="button">← ${step?"Pertanyaan sebelumnya":"Kembali ke awal"}</button></div></section>`;
  } else {
    const none=B.sel.length===0, r=B.p[1], lv=lvl(B);
    mood(lv);
    document.getElementById("sl").textContent="Tebakanku sudah siap";
    const label={low:"Risiko rendah",mid:"Risiko sedang",high:"Risiko tinggi"}[lv];
    const adv=none?"Kamu tidak memilih gejala apa pun, jadi belum ada yang bisa dihitung. Kalau ada keluhan, coba ulangi tesnya."
      :{low:"Gejalamu sedikit atau kurang cocok dengan pola TBC. Tetap pantau ya, dan periksa kalau gejalanya bertambah atau tidak hilang.",
        mid:"Ada beberapa gejala yang perlu dicek. Sebaiknya kamu datang ke puskesmas untuk periksa dahak.",
        high:"Banyak gejalamu yang cocok dengan pola TBC. Segera periksa ke puskesmas atau fasilitas kesehatan terdekat ya."}[lv];
    const head=B.sel.map(i=>`<th>${Q[i].k}</th>`).join("");
    view.innerHTML=`<section class="bubble"><h2 data-head>Tebakanku, risikomu:</h2>
      <div class="result" data-lv="${lv}"><div class="lv">${label}</div>
        ${none?"":`<div class="score">Peluang risiko ${pc(r)}</div>
        <div><div class="track"><div class="fill" style="width:${r*100}%"></div><span class="tick" style="left:60%"></span><span class="tick" style="left:70%"></span></div>
        <div class="scale"><span>0%</span><span>Batas: rendah &lt; 60%, sedang 60–70%, tinggi ≥ 70%</span><span>100%</span></div></div>`}
        <p>${adv}</p></div>
      <a class="btn" href="https://www.google.com/maps/search/puskesmas+terdekat" target="_blank" rel="noopener">Cari puskesmas terdekat</a>
      <div class="danger"><b>Segera ke fasilitas kesehatan</b> kalau kamu batuk berdarah atau sesak napas berat.</div>
      <button class="primary" id="again" type="button">Main lagi</button></section>
    <div class="note"><b>Ini bukan diagnosis.</b> TBC hanya bisa dipastikan lewat pemeriksaan dahak (TCM atau BTA) atau rontgen oleh tenaga medis. Batuk 2 minggu atau lebih sudah cukup alasan untuk periksa ke puskesmas.</div>
    <section class="card"><h2 style="font-size:1.1rem">Jawabanmu</h2>
      <ul class="sum">${Q.map((x,i)=>`<li class="${ans[i]?"on":""}"><span>${x.t}</span><span>${ans[i]?"Ya":"Tidak"}</span></li>`).join("")}</ul></section>
    <section class="card"><details open><summary>Langkah perhitungan Bayes</summary>
      <p class="hint" style="margin:8px 0">Persentase risiko adalah peluang kelas "Seminggu lebih". Peluang tiap kelas = prior × likelihood semua gejala yang kamu pilih, lalu dibagi jumlah kedua kelas (normalisasi).${B.sel.length?"":" Belum ada gejala dipilih, jadi hasilnya sama dengan prior."}</p>
      <div class="scroll"><table><tr><th>Kelas</th><th>Prior</th>${head}<th>Skor</th><th>Peluang</th></tr>
      ${C.map((k,j)=>`<tr><td>${k.n}</td><td>${f(k.prior)}</td>${B.sel.map(i=>`<td>${f(k.lik[i])}</td>`).join("")}<td>${B.sc[j].toExponential(3)}</td><td>${pc(B.p[j])}</td></tr>`).join("")}</table></div>
      <p class="hint" style="margin:8px 0">Prior = jumlah frekuensi kelas ÷ ${TOTAL}. Likelihood = frekuensi gejala ÷ jumlah frekuensi kelas.</p></details></section>`;
  }
  focusHead();
}
view.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="start"){step=0;last="";render()}
  else if(b.id==="back"){step--;last="";render()}
  else if(b.id==="again"){ans=Q.map(()=>null);step=-1;last="";render()}
  else if(b.dataset.v!==undefined){ans[step]=+b.dataset.v;last=REACT[ans[step]];step++;render()}
});
let sc=1;try{sc=parseFloat(localStorage.getItem("scale"))||1}catch(e){}
function setScale(v){sc=Math.min(1.5,Math.max(.9,v));document.documentElement.style.setProperty("--scale",sc);try{localStorage.setItem("scale",sc)}catch(e){}}
setScale(sc);
document.getElementById("lg").onclick=()=>setScale(sc+.15);
document.getElementById("sm").onclick=()=>setScale(sc-.15);
render();
</script>
</body>
</html>
